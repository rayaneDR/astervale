name: Layer preview prerelease
on:
  push:
    tags: ['layer-v*']
permissions:
  contents: write
jobs:
  layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check, build and package
        run: |
          python3 -m unittest discover -s tests -v
          bash gradlew --no-daemon :layer:assembleDebug :layer:lintDebug
          python3 -m pip install --only-binary=:all: -r requirements-assets.txt
          python3 tools/create_brand_assets.py
          python3 tools/package_layer.py
      - name: Publish experimental layer (never a ROM)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.apk dist/*.zip dist/SHA256SUMS dist/artifacts.json --prerelease --title "AsterVale layer preview (hardware untested)" --notes-file docs/releases/layer-preview.md
