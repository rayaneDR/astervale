name: Source and APK checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33fdc760091ecad2b7a9eb
        with:
          distribution: temurin
          java-version: '21'
      - name: Source checks
        run: |
          python3 -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/preview.js
      - name: Build standalone APK only
        run: bash gradlew --no-daemon :layer:assembleDebug
      - name: Run actual Java language matcher
        run: |
          mkdir -p output/classes
          javac --release 17 -d output/classes layer/src/main/java/org/astervale/panel/IntentEngine.java assistant/Benchmark.java
          java -cp output/classes Benchmark layer/src/main/assets/commands.tsv assistant/benchmark.tsv output/language-benchmark.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-checks-not-ROM
          path: |
            layer/build/outputs/apk/debug/*.apk
            output/language-benchmark.md
          retention-days: 3
