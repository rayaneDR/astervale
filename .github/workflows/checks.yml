name: Source and APK checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Source checks
        run: |
          python3 -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/preview.js
      - name: Build standalone APK only
        run: bash gradlew --no-daemon :layer:assembleDebug
      - name: Run actual Java language matcher
        run: |
          mkdir -p output/classes
          javac --release 17 -d output/classes layer/src/main/java/org/astervale/panel/IntentEngine.java assistant/Benchmark.java assistant/SafetyTests.java
          java -cp output/classes Benchmark layer/src/main/assets/commands.tsv assistant/benchmark.tsv output/language-benchmark.md
          java -cp output/classes SafetyTests layer/src/main/assets/commands.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-checks-not-ROM
          path: |
            layer/build/outputs/apk/debug/*.apk
            output/language-benchmark.md
          retention-days: 3
